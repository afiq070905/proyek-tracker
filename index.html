<style>
:root{--bg:#F3F6FB;--card:#FFFFFF;--inp:#F6F8FC;--ink:#0F1B2D;--mute:#64748B;--line:#E4E9F2;--acc:#1D4ED8;--acc-t:#fff;--ok:#15803D;--warn:#B45309;--bad:#DC2626;--c0:#2563EB;--c1:#F59E0B;--c2:#14B8A6;--h1:#0B2545;--h2:#1E4E8C;--sh:0 1px 2px rgba(15,27,45,.05),0 6px 18px rgba(15,27,45,.07);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0A1220;--card:#121C2E;--inp:#0D1626;--ink:#E7EEF8;--mute:#8FA1BA;--line:#22304A;--acc:#60A5FA;--acc-t:#08111F;--ok:#4ADE80;--warn:#FBBF24;--bad:#F87171;--c0:#60A5FA;--c1:#FBBF24;--c2:#2DD4BF;--h1:#08121F;--h2:#16346A;--sh:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35)}}
:root[data-theme="dark"]{--bg:#0A1220;--card:#121C2E;--inp:#0D1626;--ink:#E7EEF8;--mute:#8FA1BA;--line:#22304A;--acc:#60A5FA;--acc-t:#08111F;--ok:#4ADE80;--warn:#FBBF24;--bad:#F87171;--c0:#60A5FA;--c1:#FBBF24;--c2:#2DD4BF;--h1:#08121F;--h2:#16346A;--sh:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 14px/1.5 "Plus Jakarta Sans",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;justify-content:space-between;align-items:center;padding:12px 16px;color:#fff;background:linear-gradient(135deg,var(--h1),var(--h2))}
.brand{display:flex;align-items:center;gap:12px}.brand b{display:block;font-size:16px;font-weight:700;line-height:1.2}.brand small{opacity:.75;font-size:12px}
.tr{display:flex;align-items:center;gap:8px}.syn{font-size:11px;font-weight:700;padding:3px 9px;border-radius:12px;background:rgba(255,255,255,.16);white-space:nowrap}.syn:empty{display:none}
.logo,.gear{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.16);border:0;color:#fff;cursor:pointer}
.wrap{max-width:720px;margin:0 auto;padding:16px 14px 110px}
h2{font-size:15px;margin:0 0 10px;font-weight:700}
.sec{font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.07em;margin:20px 2px 8px;font-weight:700}
.sub{color:var(--mute);margin:2px 0 12px;font-size:13px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:var(--card);border-top:1px solid var(--line);box-shadow:0 -6px 20px rgba(15,27,45,.08);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;color:var(--mute);font:600 11px "Plus Jakarta Sans",system-ui,sans-serif;padding:6px 2px;cursor:pointer;border-radius:12px;min-height:48px}
nav button.on{color:var(--acc)}
nav .fab .i{width:48px;height:48px;padding:13px;border-radius:50%;background:var(--acc);color:var(--acc-t);margin-top:-24px;box-shadow:0 8px 18px rgba(29,78,216,.38)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:var(--sh)}
.bar-top{display:flex;gap:10px;align-items:flex-end;margin-bottom:12px}.bar-top>div{flex:1}.bar-top label{margin-top:0}
.pill{background:var(--acc);color:var(--acc-t);border:0;border-radius:24px;padding:0 18px;font:700 13px "Plus Jakarta Sans",system-ui,sans-serif;min-height:44px;cursor:pointer;white-space:nowrap;box-shadow:0 4px 12px rgba(29,78,216,.3)}
.hero{display:flex;justify-content:space-between;align-items:center;gap:12px;color:#fff;border-radius:20px;padding:20px;margin-bottom:12px;background:linear-gradient(135deg,var(--h1),var(--h2));box-shadow:0 12px 26px rgba(11,37,69,.3)}
.hero small{opacity:.8;font-size:11px;text-transform:uppercase;letter-spacing:.08em}
.hero-n{font:600 25px "IBM Plex Mono",ui-monospace,monospace;margin:4px 0;word-break:break-all}.hero-n.neg2{color:#FCA5A5}
.hero-s{opacity:.8;font-size:13px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--acc);border-radius:14px;padding:12px;box-shadow:var(--sh)}
.kpi small{display:block;color:var(--mute);font-size:12px;font-weight:600}.kpi .num{font-size:15px}
.num{font-family:"IBM Plex Mono",ui-monospace,monospace;font-weight:500;white-space:nowrap}
.neg,.bad{color:var(--bad)}.pos,.ok{color:var(--ok)}.warn{color:var(--warn)}
.pc{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh);padding:14px;margin-bottom:10px}
.pc-h{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.pc-h b{font-size:15px}
.pc-bar{margin:12px 0}
.pc-g{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.pc-g small{display:block;color:var(--mute);font-size:11px}.pc-g .num{font-size:12px}
.pc-f{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:13px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{color:var(--mute);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.04em;background:var(--inp)}
td,th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.r{text-align:right}.tot td{font-weight:700;border-top:2px solid var(--line)}
.pb{height:9px;border-radius:5px;background:var(--line);overflow:hidden;min-width:70px}.pb i{display:block;height:100%;border-radius:5px}
.bg-ok{background:var(--ok)}.bg-warn{background:var(--warn)}.bg-bad{background:var(--bad)}
.cr{display:grid;grid-template-columns:105px 1fr auto;gap:8px;align-items:center;margin:10px 0;font-size:13px}.cr .pb{height:7px;margin:3px 0}
.mo{display:flex;align-items:flex-end;gap:8px;height:130px;padding-top:8px}
.mo div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:11px;color:var(--mute)}
.mo i{display:block;width:100%;max-width:46px;background:linear-gradient(180deg,var(--c0),var(--h2));border-radius:6px 6px 0 0;min-height:2px}
.al{padding:10px 12px;border-left:4px solid var(--warn);background:var(--inp);margin:8px 0;border-radius:0 10px 10px 0;font-size:13px}.al.b{border-color:var(--bad)}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:0 12px}
label{display:block;font-size:12px;color:var(--mute);margin:12px 0 4px;font-weight:600}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--inp);color:var(--ink);font:inherit;min-height:46px}
textarea{min-height:120px;font-family:"IBM Plex Mono",monospace;font-size:12px}
input:focus,select:focus,textarea:focus{border-color:var(--acc)}
:is(input,select,textarea,button,summary):focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.btn{background:var(--acc);color:var(--acc-t);border:0;border-radius:12px;padding:11px 18px;font:700 14px "Plus Jakarta Sans",system-ui,sans-serif;cursor:pointer;min-height:46px;margin:14px 8px 0 0;box-shadow:0 4px 12px rgba(29,78,216,.25)}
.btn.s{background:none;color:var(--acc);border:1px solid var(--acc);box-shadow:none}
a.btn{display:inline-block;text-decoration:none;line-height:24px}
.x{background:none;border:0;color:var(--acc);cursor:pointer;font:600 13px "Plus Jakarta Sans",system-ui,sans-serif;padding:4px 6px}.x.d{color:var(--bad)}
.seg{display:inline-flex;background:var(--inp);border:1px solid var(--line);border-radius:12px;padding:3px;margin-bottom:12px}
.seg button{border:0;background:none;color:var(--mute);padding:9px 18px;font:600 13px "Plus Jakarta Sans",system-ui,sans-serif;cursor:pointer;border-radius:9px}.seg button.on{background:var(--acc);color:var(--acc-t)}
.msg{font-size:13px;min-height:18px;margin-top:8px}
.empty{color:var(--mute);text-align:center;padding:30px 10px}
.badge{font-size:11px;font-weight:700;border-radius:20px;padding:2px 10px;background:rgba(100,116,139,.16);color:var(--mute);white-space:nowrap}
.badge.st-Berjalan{background:rgba(37,99,235,.14);color:var(--acc)}.badge.st-Selesai{background:rgba(21,128,61,.15);color:var(--ok)}.badge.st-Ditunda{background:rgba(180,83,9,.15);color:var(--warn)}
details{margin-top:12px}summary{cursor:pointer;color:var(--acc);font-weight:600}
.ov{position:fixed;inset:0;background:rgba(8,15,30,.55);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--card);border-radius:22px 22px 0 0;padding:12px 18px calc(18px + env(safe-area-inset-bottom,0px));max-height:90vh;overflow:auto;max-width:560px;margin:0 auto;box-shadow:0 -12px 32px rgba(0,0,0,.28)}
.grab{width:42px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
.sig{display:grid;grid-template-columns:1fr 1fr;gap:30px;margin-top:40px;text-align:center}.sig div{border-top:1px solid var(--ink);padding-top:4px}
@media (min-width:900px){
 nav{top:0;bottom:auto;right:auto;width:210px;flex-direction:column;gap:4px;padding:84px 10px 10px;border-top:0;border-right:1px solid var(--line);box-shadow:none;z-index:10}
 nav button{flex:none;flex-direction:row;gap:12px;font-size:14px;padding:10px 12px;justify-content:flex-start}
 nav button.on{background:rgba(37,99,235,.1)}
 nav .fab .i{width:22px;height:22px;padding:0;margin:0;background:none;color:inherit;box-shadow:none}
 .wrap{margin-left:210px;max-width:none;padding:22px 28px 40px}#app{max-width:980px;margin:0 auto}
 .kpis{grid-template-columns:repeat(4,1fr)}
}
@media print{body{--bg:#fff;--card:#fff;--ink:#000;--mute:#444;--line:#999;--inp:#fff}.noprint,nav,.top,.ov,.sheet{display:none!important}.card{border:0;padding:0;box-shadow:none}.wrap{margin:0;padding:0}}
</style>
</head>
<body>
<header class="top noprint"><div class="brand"><span class="logo"><svg class="i" viewBox="0 0 24 24"><path d="M6 19v-8M12 19V5M18 19v-6"/></svg></span><div><b>Kontrol Biaya Proyek</b><small id="vt">Ringkasan semua proyek</small></div></div><div class="tr"><span id="sy" class="syn"></span><button class="gear" data-v="dat" aria-label="Data dan cadangan"><svg class="i" viewBox="0 0 24 24"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></svg></button></div></header>
<div class="wrap"><main id="app"></main></div>
<nav id="nav" class="noprint" aria-label="Menu utama">
<button data-v="dash"><svg class="i" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>Beranda</span></button>
<button data-v="pro"><svg class="i" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span>Proyek</span></button>
<button data-v="trx" class="fab"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span>Catat</span></button>
<button data-v="cpt"><svg class="i" viewBox="0 0 24 24"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg><span>Cepat</span></button>
<button data-v="lap"><svg class="i" viewBox="0 0 24 24"><path d="M6 2h9l5 5v15H6zM14 2v6h6M9 13h6M9 17h6"/></svg><span>Laporan</span></button>
</nav>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
const KAT=['Material/Bahan','Upah Tukang','DLL'],ST=['Perencanaan','Berjalan','Selesai','Ditunda'];
let S={projects:[],items:[],kas:[]},V='dash',F='all',T='out',ED=null,Q='',LP='',LF='',LT='',MSG='',MC='',CP=[],CTXT='',CD='',CPID='',DUP=false,SH=false;
try{const r=localStorage.getItem('kbp_v2');if(r){const p=JSON.parse(r);if(p&&p.projects&&p.items&&p.kas)S=p;}}catch(e){}
const save=()=>{try{localStorage.setItem('kbp_v2',JSON.stringify(S));}catch(e){}mark()};
const $=id=>document.getElementById(id),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const E=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rp=n=>(n<0?'-':'')+'Rp '+Math.abs(Math.round(n)).toLocaleString('id-ID');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const tg=s=>s?s.split('-').reverse().join('/'):'-',P=id=>S.projects.find(p=>p.id===id),amt=i=>i.qty*i.harga;
const pct=(a,b)=>b>0?a/b*100:(a>0?999:0),sev=p=>p>100?'bad':p>=80?'warn':'ok',pf=n=>n>=999?'>100%':n.toFixed(1)+'%';
const BLN=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
function ps(p,from,to){
  const ok=t=>(!from||t>=from)&&(!to||t<=to),its=S.items.filter(i=>i.pid===p.id&&ok(i.tgl)).sort((a,b)=>a.tgl<b.tgl?-1:1);
  const by=[0,0,0];its.forEach(i=>by[KAT.indexOf(i.kat)]+=amt(i));
  const real=by[0]+by[1]+by[2],rab=(p.rab[0]+p.rab[1]+p.rab[2])||p.kontrak||0,masuk=S.kas.filter(k=>k.pid===p.id&&ok(k.tgl)).reduce((a,k)=>a+k.jml,0);
  return{its,by,real,rab,sisa:rab-real,ser:pct(real,rab),masuk,saldo:masuk-real};
}
const empty=h=>'<div class="card empty">'+h+'</div>';
const bar=(v,c)=>'<div class="pb"><i class="bg-'+c+'" style="width:'+Math.min(100,v)+'%"></i></div>';
const fld=(l,id,t,v,x)=>'<div><label for="'+id+'">'+l+'</label><input id="'+id+'" type="'+t+'" value="'+E(v)+'" '+(x||'')+'></div>';
const sel=(l,id,o,v)=>'<div><label for="'+id+'">'+l+'</label><select id="'+id+'">'+o.map(x=>'<option value="'+E(x[0])+'"'+(x[0]===v?' selected':'')+'>'+E(x[1])+'</option>').join('')+'</select></div>';
const popts=()=>S.projects.map(p=>[p.id,(p.kode?p.kode+' - ':'')+p.nama]);
const fsel=(id,v)=>sel('Proyek',id,[['all','Semua proyek']].concat(popts()),v);

function dash(){
  if(!S.projects.length)return empty('Belum ada proyek.<br><br><button class="btn" data-a="np" style="margin:0">+ Tambah proyek pertama</button><br><span class="sub">Atau muat data contoh lewat ikon pengaturan di kanan atas.</span>');
  if(F!=='all'&&!P(F))F='all';
  const st=S.projects.map(p=>({p,s:ps(p)})),L=F==='all'?st:st.filter(x=>x.p.id===F);
  const sum=f=>L.reduce((a,x)=>a+f(x),0),A=sum(x=>x.s.rab),R=sum(x=>x.s.real),M=sum(x=>x.s.masuk),sr=pct(R,A);
  const by=[0,1,2].map(i=>sum(x=>x.s.by[i])),rb=[0,1,2].map(i=>sum(x=>x.p.rab[i]));
  const k=(l,v,c,b)=>'<div class="kpi" style="border-left-color:'+b+'"><small>'+l+'</small><span class="num '+(c||'')+'">'+v+'</span></div>';
  let h='<div class="bar-top noprint">'+fsel('f',F)+'<button class="pill" data-a="np">+ Proyek baru</button></div>'
   +'<div class="hero"><div><small>Selisih anggaran</small><div class="hero-n'+(A-R<0?' neg2':'')+'">'+rp(A-R)+'</div><div class="hero-s">dari anggaran '+rp(A)+'</div></div>'+ring(sr)+'</div>'
   +'<div class="kpis">'+k('Realisasi',rp(R),'','var(--c0)')+k('Pencairan',rp(M),'','var(--c2)')+k('Saldo kas',rp(M-R),M-R<0?'neg':'','var(--c1)')+k('Serapan',pf(sr),sev(sr),'var(--acc)')+'</div>';
  const al=[];L.forEach(x=>{const n=E(x.p.nama);if(x.s.ser>100)al.push(['b',n+' melebihi anggaran sebesar '+rp(-x.s.sisa)+'.']);else if(x.s.ser>=80)al.push(['',n+' sudah menyerap '+pf(x.s.ser)+' dari anggaran.']);
    KAT.forEach((c,i)=>{if(x.p.rab[0]+x.p.rab[1]+x.p.rab[2]>0&&x.s.by[i]>x.p.rab[i])al.push(['b',n+': '+c+' melebihi RAB ('+rp(x.s.by[i])+' dari '+rp(x.p.rab[i])+').']);});
    {const f=fc(x.p,x.s);if(f&&x.s.rab>0&&x.s.ser<=100&&f.eac>x.s.rab*1.05&&x.s.ser>f.w+15)al.push(['',n+': serapan '+pf(x.s.ser)+' sementara waktu terpakai '+f.w.toFixed(0)+'%. Pada laju ini perkiraan biaya akhir '+rp(f.eac)+' (RAB '+rp(x.s.rab)+'), perkiraan kasar secara linear.'])}
    if(x.s.masuk>0&&x.s.saldo<0)al.push(['',n+': saldo kas negatif ('+rp(x.s.saldo)+'), pengeluaran lebih besar dari pencairan.']);});
  if(al.length)h+='<div class="card"><h2>Perlu perhatian</h2>'+al.map(a=>'<div class="al '+a[0]+'">'+a[1]+'</div>').join('')+'</div>';
  h+='<div class="card"><h2>Anggaran vs realisasi per kategori</h2>'+KAT.map((c,i)=>{const p=pct(by[i],rb[i]);return '<div class="cr"><span>'+c+'</span><div><div class="pb"><i style="width:100%;background:var(--c'+i+')"></i></div>'+bar(p,sev(p))+'</div><span class="num">'+rp(by[i])+' / '+rp(rb[i])+'</span></div>'}).join('')+'<p class="sub" style="margin:4px 0 0">Bar atas: anggaran (RAB). Bar bawah: realisasi.</p></div>';
  const mo={};L.forEach(x=>x.s.its.forEach(i=>{const m=i.tgl.slice(0,7);mo[m]=(mo[m]||0)+amt(i)}));
  const ms=Object.keys(mo).sort().slice(-8),mx=Math.max.apply(null,ms.map(m=>mo[m]).concat([1]));
  h+='<div class="card"><h2>Pengeluaran per bulan</h2>'+(ms.length?'<div class="mo">'+ms.map(m=>'<div title="'+rp(mo[m])+'"><span class="num" style="font-size:10px">'+(mo[m]/1e6).toFixed(1)+' jt</span><i style="height:'+(mo[m]/mx*85)+'%"></i>'+BLN[+m.slice(5)-1]+' '+m.slice(2,4)+'</div>').join('')+'</div>':'<div class="empty">Belum ada pengeluaran.</div>')+'</div>';
  h+='<div class="sec">Proyek</div>'+L.map(x=>{const c=sev(x.s.ser);return '<div class="pc"><div class="pc-h"><div><b>'+E(x.p.nama)+'</b><span class="sub" style="margin:0;display:block">'+E(x.p.kode||'')+(x.p.lokasi?' · '+E(x.p.lokasi):'')+'</span></div><span class="badge st-'+E(x.p.status)+'">'+E(x.p.status)+'</span></div><div class="pc-bar">'+bar(x.s.ser,c)+'</div><div class="pc-g"><div><small>Anggaran</small><span class="num">'+rp(x.s.rab)+'</span></div><div><small>Realisasi</small><span class="num">'+rp(x.s.real)+'</span></div><div><small>Selisih</small><span class="num '+(x.s.sisa<0?'neg':'pos')+'">'+rp(x.s.sisa)+'</span></div></div><div class="pc-f"><span class="num '+c+'">'+pf(x.s.ser)+' terserap</span><button class="x" data-a="cp" data-id="'+x.p.id+'">+ Catat</button></div></div>'}).join('');
  return h;

  if(!SY.url)return{ok:false,error:'Alamat Google Sheet belum diatur.'};
  if(syBusy)return{ok:false,error:'Sedang menyinkron, coba lagi sebentar.'};
  syBusy=true;const sv=VER;syUI('Menyinkron...');
  try{
    const r=await fetch(SY.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'sync',secret:SY.secret,data:S})});
    const j=await r.json();if(!j.ok)throw new Error(j.error||'Gagal');
    SY.dirty=VER!==sv;SY.last=new Date().toISOString();syS();syBusy=false;syUI();
    if(SY.dirty)setTimeout(()=>{syncNow()},500);
    return j;
  }catch(e){SY.dirty=true;syS();syBusy=false;syUI('Menunggu sinkron');return{ok:false,error:String((e&&e.message)||e)}}
}
const m2=(t,c)=>{const m=$('m2');if(m){m.className='msg '+c;m.textContent=t}};
const syncCard=()=>'<div class="card"><h2>Sinkron ke Google Sheets</h2><p class="sub">Setiap data disimpan, salinannya dikirim otomatis ke Google Sheet dengan format buku kas klien. Status: <b id="sst">'+syTxt()+'</b></p>'+fld('Alamat Web App (dari Apps Script)','s1','url',SY.url,'placeholder="https://script.google.com/macros/s/.../exec"')+fld('Kode rahasia','s2','text',SY.secret)+'<button class="btn" data-a="ss">Simpan pengaturan</button><button class="btn s" data-a="sy">Sinkron sekarang</button><button class="btn s" data-a="sl">Pulihkan dari Google Sheet</button><div class="msg" id="m2"></div></div>';
function ledger(p){
  const s=ps(p),KC=[0,5,10],TT=['MATERIAL/BAHAN','UPAH TUKANG','DLL'];
  const its=KAT.map(c=>s.its.filter(i=>i.kat===c)),kas=S.kas.filter(k=>k.pid===p.id).sort((a,b)=>a.tgl<b.tgl?-1:1);
  const n=Math.max(1,its[0].length,its[1].length,its[2].length,kas.length),end=8+n,rows=[];
  for(let r=0;r<end;r++)rows.push(new Array(18).fill(null));
  const set=(r,c,v)=>{rows[r-1][c]=v};
  set(1,0,'NAMA PEKERJAAN');set(1,1,p.nama);set(2,0,'NILAI KONTRAK');set(2,1,kontrak(p));
  set(3,0,'PENCAIRAN');set(3,1,{t:'n',v:s.masuk,f:'SUM(R9:R'+end+')'});
  set(4,0,'TOTAL PENGELUARAN');set(4,1,{t:'n',v:s.real,f:'D7+I7+N7'});
  set(5,0,'SELISIH');set(5,1,{t:'n',v:s.masuk-s.real,f:'B3-B4'});
  TT.forEach((t,g)=>{const c0=KC[g],kc=c0+3,L=String.fromCharCode(65+kc);
    set(7,c0,t);set(7,c0+2,'TOTAL');set(7,kc,{t:'n',v:s.by[g],f:'SUM('+L+'9:'+L+end+')'});
    ['TANGGAL','KETERANGAN','DEBIT','KREDIT'].forEach((h,j)=>set(8,c0+j,h));
    its[g].forEach((x,i)=>{set(9+i,c0,tg(x.tgl));set(9+i,c0+1,x.ket+' ('+x.qty+(x.sat?' '+x.sat:'')+' x '+rp(x.harga)+')'+(x.toko?' - '+x.toko:'')+(x.nota?' ['+x.nota+']':''));set(9+i,kc,amt(x))})});
  set(7,15,'RIWAYAT PENCAIRAN');['TANGGAL','KETERANGAN','JUMLAH'].forEach((h,j)=>set(8,15+j,h));
  kas.forEach((k,i)=>{set(9+i,15,tg(k.tgl));set(9+i,16,k.ket);set(9+i,17,k.jml)});
  return rows;
}

$('app').addEventListener('click',e=>{
  const t=e.target.closest('[data-a]')||e.target,a=t.dataset.a,id=t.dataset.id;if(!a)return;
  if(a==='ss'){const u=$('s1').value.trim();if(u&&!/^https:\/\/script\.google\.com\//.test(u))return m2('Alamat harus diawali https://script.google.com/','bad');SY.url=u;SY.secret=$('s2').value.trim();SY.dirty=!!u;syS();syUI();m2(u?'Pengaturan disimpan. Tekan Sinkron sekarang untuk mencoba.':'Sinkron dimatikan.','ok')}
  if(a==='sy'){if(!SY.url)return m2('Isi alamat Web App dulu.','bad');m2('Menyinkron...','ok');syncNow().then(r=>{m2(r.ok?'Berhasil: '+r.projects+' proyek terkirim ke Google Sheet.':'Gagal: '+r.error+'. Data aman di HP dan akan dicoba lagi otomatis.',r.ok?'ok':'bad')})}

    fetch(SY.url+(SY.url.indexOf('?')<0?'?':'&')+'action=load&secret='+encodeURIComponent(SY.secret)).then(r=>r.json()).then(j=>{if(!j.ok)throw new Error(j.error||'Gagal');const d=j.data;if(!d||!Array.isArray(d.projects)||!Array.isArray(d.items)||!Array.isArray(d.kas))throw new Error('Belum ada data di Google Sheet');S=d;save();V='dash';draw()}).catch(e=>{m2('Gagal: '+((e&&e.message)||e),'bad')})}

    const pid=uid();S.projects.push(Object.assign({id:pid},o));const pc=num('n3');if(pc>0)S.kas.push({id:uid(),pid:pid,tgl:today(),ket:'Pencairan awal',jml:pc});
